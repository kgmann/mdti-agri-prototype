# Full stack: database, app and reverse proxy. For local development, start only `db`.
name: agri-digit

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: agri
      POSTGRES_DB: agri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # localhost only, for development and debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agri"]
      interval: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agri:${POSTGRES_PASSWORD}@db:5432/agri
      READONLY_DATABASE_URL: postgres://readonly_assistant:${READONLY_DB_PASSWORD}@db:5432/agri
    profiles: ["full"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    profiles: ["full"]

volumes:
  pg-data:
  caddy-data:
